# SeetaCloud / AutoDL: preinstalled PyTorch 2.3.0+cu121
# RTX 5090 (sm_120) is not supported by this PyTorch build; training.device=auto falls back to CPU.
# Server profile: ~15 CPU cores, ~92 GB RAM
project_name: CLFER-LT-Cloud
seed: 42

data:
  data_dir: data/goemotions
  max_length: 64
  num_labels: 28
  include_neutral: true

model:
  backbone: roberta-base
  hidden_dropout: 0.1
  projection_dim: 256
  use_memory_queue: true
  queue_size: 4096
  momentum: 0.999

loss:
  lambda_supcon: 0.5
  lambda_proto: 0.3
  temperature: 0.07
  proto_temperature: 0.1
  focal_gamma: 2.0
  cb_beta: 0.9999

training:
  device: auto
  batch_size: 24
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  num_workers: 4
  fp16: false
  save_dir: outputs/checkpoints
  log_dir: outputs/logs
  eval_steps: 500
  save_steps: 500

evaluation:
  threshold: 0.5
