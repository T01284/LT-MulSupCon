# Hard SupCon + BCE (exact label match, no LPC/queue)
project_name: CLFER-LT-HardSupCon
seed: 42

data:
  data_dir: data/goemotions
  max_length: 64
  num_labels: 28
  include_neutral: true

model:
  backbone: roberta-base
  cache_dir: models/hf_cache
  local_files_only: false

loss:
  lambda_supcon: 0.10
  temperature: 0.07
  focal_gamma: 2.0
  cb_beta: 0.9999

training:
  experiment_name: hard_supcon
  device: auto
  batch_size: 32
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  num_workers: 4
  fp16: false
  save_dir: outputs/checkpoints
  log_dir: outputs/logs

evaluation:
  threshold: 0.5
