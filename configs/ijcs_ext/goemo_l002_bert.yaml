# Generated by scripts/make_ext_configs.py from configs/tune/clfer_lt_l002.yaml; overrides: {'model.backbone': 'bert-base-uncased'}
project_name: CLFER-LT-IJCS-ext-goemo-l002-bert
seed: 42
data:
  data_dir: data/goemotions
  max_length: 64
  num_labels: 28
  include_neutral: true
model:
  backbone: bert-base-uncased
  cache_dir: models/hf_cache
  local_files_only: false
  hidden_dropout: 0.1
  projection_dim: 256
  use_memory_queue: true
  queue_size: 4096
  momentum: 0.999
loss:
  lambda_supcon: 0.02
  lambda_proto: 0.3
  temperature: 0.07
  proto_temperature: 0.1
  focal_gamma: 2.0
  cb_beta: 0.9999
training:
  device: auto
  batch_size: 32
  epochs: 5
  learning_rate: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  num_workers: 4
  fp16: false
  save_dir: outputs/checkpoints
  log_dir: outputs/logs
evaluation:
  threshold: 0.5
